<meta name="mobile-web-app-capable" content="yes">

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one-column phone app on an ice-floe ground; the white seal runs a crêpe stand, the griddle is the stage. */
:root{
  --bg:#E6F1F8; --floe:#F7FBFE; --surface:#FFFFFF; --ink:#1E3448; --muted:#6A8195;
  --line:#D3E3EE; --accent:#FF7F9B; --accent-ink:#FFFFFF; --good:#4CBF9A; --good-soft:#DDF4EC;
  --again:#F6A341; --again-soft:#FDEDD8; --coin:#F5B83D; --coin-ink:#7A5200;
  --seal:#FFFFFF; --seal-belly:#F2F6F9; --seal-stroke:#C9D9E5; --seal-line:#2B4054; --cheek:#FFB3C3;
  --wall:#FFF6EE; --counter:#F3E1CC;
  --f-word:"Fredoka","Huninn","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  --f-zh:"Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1D2A; --floe:#142636; --surface:#1A2F42; --ink:#E6F0F7; --muted:#93AABD;
  --line:#2A4358; --accent:#FF8FA8; --accent-ink:#1A1020; --good:#5FD1AC; --good-soft:#173A33;
  --again:#F8B25E; --again-soft:#3A2C1A; --coin:#F7C452; --coin-ink:#3A2700;
  --seal:#F6F9FB; --seal-belly:#E6EEF3; --seal-stroke:#AFC2D1; --seal-line:#1B2B39; --cheek:#F59AB0;
  --wall:#22384C; --counter:#2E4559; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1D2A; --floe:#142636; --surface:#1A2F42; --ink:#E6F0F7; --muted:#93AABD;
  --line:#2A4358; --accent:#FF8FA8; --accent-ink:#1A1020; --good:#5FD1AC; --good-soft:#173A33;
  --again:#F8B25E; --again-soft:#3A2C1A; --coin:#F7C452; --coin-ink:#3A2700;
  --seal:#F6F9FB; --seal-belly:#E6EEF3; --seal-stroke:#AFC2D1; --seal-line:#1B2B39; --cheek:#F59AB0;
  --wall:#22384C; --counter:#2E4559; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-zh);font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.app{max-width:460px;margin:0 auto;padding-block:14px 32px;display:flex;flex-direction:column;gap:14px;min-height:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.view{display:flex;flex-direction:column;gap:14px}

/* seal */
.seal{width:132px;height:auto;display:block;overflow:visible}
.seal [fill="var(--seal)"]{stroke:var(--seal-stroke);stroke-width:2;stroke-linejoin:round}
.seal .eye-open{display:block}.seal .eye-happy{display:none}
.seal.happy .eye-open{display:none}.seal.happy .eye-happy{display:block}
.bob{animation:bob 3.2s ease-in-out infinite;transform-origin:50% 90%}
.hop{animation:hop .55s cubic-bezier(.3,1.6,.5,1)}
.tilt{animation:tilt .6s ease-in-out}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes hop{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-14px) scale(1.04,.96)}100%{transform:translateY(0)}}
@keyframes tilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-9deg)}65%{transform:rotate(6deg)}}

/* shared */
.hero{display:flex;align-items:flex-end;gap:12px}
.bubble{position:relative;background:var(--surface);border-radius:18px;padding:12px 14px;line-height:1.5;flex:1;min-width:0;box-shadow:0 2px 0 var(--line)}
.bubble::after{content:"";position:absolute;left:-7px;bottom:18px;width:14px;height:14px;background:var(--surface);transform:rotate(45deg);border-radius:3px}
.bubble b{color:var(--accent)}
.panel{background:var(--surface);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 3px 0 var(--line)}
.panel h2{margin:0;font-size:15px;font-weight:400;color:var(--muted);letter-spacing:.04em}
.counts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.count{background:var(--floe);border-radius:16px;padding:12px 14px}
.count .n{font-family:var(--f-word);font-weight:700;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.count .l{font-size:14px;color:var(--muted);margin-top:4px}
.btn-main{background:var(--accent);color:var(--accent-ink);font-size:19px;border-radius:999px;padding:15px 20px;font-weight:600;
  box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000 25%);transition:transform .1s}
.btn-main:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000 25%)}
.btn-main[disabled]{opacity:.5;cursor:default}
.btn-soft{background:var(--floe);border-radius:999px;padding:13px 18px;font-size:17px}
.modes{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
.modes .btn-soft{font-size:16px}
.bar{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--line)}
.bar span{display:block;height:100%;transition:width .5s}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.legend b{color:var(--ink);font-family:var(--f-word);font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.label{font-size:14px;color:var(--muted);min-width:5.5em}
.seg{display:inline-flex;background:var(--floe);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:7px 14px;border-radius:999px;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.link{color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-size:15px}
.sync{display:inline-flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.on i{background:var(--good)}
.streak{font-family:var(--f-word);font-weight:600;color:var(--again)}
.coinpill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:6px 12px 6px 6px;font-family:var(--f-word);font-weight:600;font-variant-numeric:tabular-nums;position:relative}
.coin{width:22px;height:22px;border-radius:50%;background:var(--coin);box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--coin) 70%,#000 20%);display:grid;place-items:center;color:var(--coin-ink);font-size:12px;font-weight:700;font-family:var(--f-word)}
.topbar{display:flex;align-items:center;gap:10px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);flex:none}
.track{flex:1;position:relative;height:12px;background:var(--surface);border-radius:999px}
.track .fill{position:absolute;inset:0 auto 0 0;background:var(--good);border-radius:999px;transition:width .35s}
.tally{font-family:var(--f-word);font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:3.4em;text-align:right}
h1.page{margin:0;font-size:20px;font-weight:400;flex:1}
.float{position:absolute;right:0;top:-6px;font-family:var(--f-word);font-weight:700;color:var(--coin-ink);background:var(--coin);border-radius:999px;padding:2px 8px;font-size:14px;animation:floatup 1.2s ease-out forwards;pointer-events:none}
@keyframes floatup{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-34px);opacity:0}}

/* flashcards */
.stage{perspective:1200px}
.card{position:relative;height:min(52vh,380px);min-height:290px;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.7,.3,1);cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border-radius:28px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;box-shadow:0 5px 0 var(--line)}
.back{transform:rotateY(180deg)}
.tag{position:absolute;top:16px;left:18px;font-size:13px;padding:4px 10px;border-radius:999px;background:var(--floe);color:var(--muted)}
.tag.new{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.word{font-family:var(--f-word);font-weight:600;font-size:clamp(34px,10vw,48px);line-height:1.1;overflow-wrap:anywhere}
.hint{font-size:14px;color:var(--muted)}
.speak{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--floe);font-size:14px;color:var(--muted)}
.senses{display:flex;flex-direction:column;gap:8px;align-items:center;max-width:100%}
.sense{display:flex;gap:8px;align-items:baseline;justify-content:center;flex-wrap:wrap;font-size:clamp(18px,5.2vw,22px);line-height:1.5}
.pos{font-family:var(--f-word);font-size:13px;font-weight:600;padding:2px 8px;border-radius:8px;background:var(--floe);color:var(--muted);flex:none}
.back .word{font-size:clamp(26px,7vw,34px)}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ans{border-radius:20px;padding:16px 10px;font-size:18px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
.ans small{font-weight:400;font-size:13px;opacity:.8}
.ans.again{background:var(--again-soft);color:color-mix(in srgb,var(--again) 70%,var(--ink))}
.ans.good{background:var(--good-soft);color:color-mix(in srgb,var(--good) 65%,var(--ink))}
.flip-btn{background:var(--surface);border-radius:20px;padding:16px;font-size:18px;box-shadow:0 3px 0 var(--line)}

/* crêpe game */
.shopfront{position:relative;border-radius:24px;background:var(--wall);overflow:hidden;min-height:150px;display:flex;align-items:flex-end;gap:10px;padding:14px 14px 0}
.decor{position:absolute;inset:0;pointer-events:none}
.customer{width:92px;flex:none;position:relative;z-index:1;transition:transform .5s cubic-bezier(.3,1.3,.5,1)}
.customer.enter{transform:translateX(-140%)}
.customer.leave{transform:translateX(160%);transition:transform .45s ease-in}
.order{position:relative;z-index:1;flex:1;min-width:0;background:var(--surface);border-radius:18px;padding:10px 12px;margin-bottom:14px;display:flex;flex-direction:column;gap:6px;box-shadow:0 2px 0 var(--line)}
.order::before{content:"";position:absolute;left:-7px;bottom:20px;width:14px;height:14px;background:var(--surface);transform:rotate(45deg);border-radius:3px}
.order .who{font-size:13px;color:var(--muted)}
.order .zh{font-size:17px;line-height:1.45}
.order .zh .pos{margin-right:4px}
.order .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.order .speak{padding:5px 10px;font-size:13px}
.counter{height:14px;background:var(--counter);margin:0 -14px;position:relative;z-index:1}
.griddle-wrap{position:relative;display:grid;place-items:center;padding:6px 0}
.stove{position:relative;width:min(84vw,330px);aspect-ratio:1;max-width:100%;border-radius:32px;display:grid;place-items:center;transition:background .3s}
.plate{width:88%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;position:relative}
.crepe{width:94%;aspect-ratio:1;border-radius:50%;position:relative;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:6px;padding:16%;box-sizing:border-box}
.crepe.spread,.batter.spread{animation:spread .7s cubic-bezier(.3,1.1,.5,1)}
.batter{position:absolute;left:3%;top:3%;width:94%;height:94%;pointer-events:none;overflow:visible;transition:opacity .25s;z-index:0}
.crepe{z-index:1}
.batter .cook{opacity:0;animation:fadeTo1 var(--cook) linear forwards}
.batter .edge{opacity:0;animation:fadeEdge var(--cook) ease-in forwards}
.batter .spot{opacity:0;animation:fadeSpot var(--cook) ease-in forwards}
.batter .bub{transform-box:fill-box;transform-origin:center;transform:scale(0);opacity:0;animation:bub 1.5s ease-out forwards;animation-delay:var(--d)}
.batter .hole{opacity:0;animation:hole .5s ease-out forwards;animation-delay:calc(var(--d) + 1.25s)}
@keyframes fadeTo1{to{opacity:1}}
@keyframes fadeEdge{to{opacity:.85}}
@keyframes fadeSpot{to{opacity:.35}}
@keyframes bub{0%{transform:scale(0);opacity:0}25%{opacity:1}75%{transform:scale(1);opacity:1}100%{transform:scale(1.2);opacity:0}}
@keyframes hole{to{opacity:.55}}
@media (prefers-reduced-motion: reduce){.batter .cook{opacity:1!important}.batter .edge{opacity:.85!important}.batter .spot{opacity:.35!important}.batter .hole{opacity:.55!important}}
@keyframes spread{0%{transform:scale(.15);opacity:.6}100%{transform:scale(1);opacity:1}}
.crepe::before{content:"";position:absolute;inset:0;border-radius:50%;background:inherit;clip-path:inset(0 0 50% 0);opacity:0;z-index:3;pointer-events:none;filter:brightness(.96)}
.crepe > *{transition:opacity .25s}
.crepe.fold > *{opacity:0}
.crepe.fold::before{animation:flap .55s ease-in-out forwards}
@keyframes flap{0%{opacity:1;transform:perspective(500px) rotateX(0)}100%{opacity:1;transform:perspective(500px) rotateX(-180deg)}}
.crepe.fold{animation:halfclip .55s ease-in-out forwards}
@keyframes halfclip{0%{clip-path:inset(0 0 0 0)}55%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(50% 0 0 0)}}
.crepe.wrap{clip-path:inset(50% 0 0 0);animation:wrapup .4s ease-in forwards}
@keyframes wrapup{0%{transform:none;opacity:1}100%{transform:translateY(-20%) scaleX(.22) rotate(-30deg);opacity:0}}
.cone{position:absolute;left:50%;top:50%;width:min(30vw,118px);transform:translate(-50%,-50%) scale(.2);opacity:0;z-index:4;pointer-events:none}
.cone.pop{animation:conepop .45s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes conepop{to{transform:translate(-50%,-50%) scale(1) rotate(-6deg);opacity:1}}
.cone.fly{animation:conefly .6s ease-in forwards}
@keyframes conefly{from{transform:translate(-50%,-50%) scale(1) rotate(-6deg);opacity:1}to{transform:translate(-120%,-250%) scale(.45) rotate(-18deg);opacity:0}}
.stick{position:absolute;width:62%;left:19%;top:50%;height:16px;pointer-events:none;opacity:0}
.stick.sweep{animation:sweep .7s ease-out}
@keyframes sweep{0%{opacity:1;transform:rotate(0)}85%{opacity:1}100%{opacity:0;transform:rotate(330deg)}}
.chef{position:absolute;right:-6px;bottom:-10px;width:78px;z-index:2}
.slot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-word);font-weight:700;font-size:19px;
  background:color-mix(in srgb,#fff 35%,transparent);border:2px dashed color-mix(in srgb,#7a4a1c 35%,transparent);box-sizing:border-box;color:#3b2410;position:relative}
.slot.gap{width:12px;background:none;border:0}
.slot.fixed{background:none;border:0;width:auto;min-width:14px}
.slot.filled{border:0;background:none;cursor:pointer;animation:plop .25s cubic-bezier(.3,1.6,.5,1)}
.slot.ok::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2.5px solid var(--good)}
.slot.hinted::after{border-color:var(--coin)}
.slot.bad{animation:shake .4s}
@keyframes plop{0%{transform:scale(.3)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.tray{background:var(--surface);border-radius:24px;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:10px;box-shadow:0 3px 0 var(--line)}
.top{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-family:var(--f-word);font-weight:700;font-size:22px;position:relative;transition:transform .12s, opacity .2s}
.top:active{transform:scale(.9)}
.top.used{opacity:0;pointer-events:none;transform:scale(.4)}
.top.gone{opacity:0;pointer-events:none;transform:scale(.2) rotate(40deg)}
.top span,.slot span{position:relative;z-index:1;display:block}
.tsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;filter:drop-shadow(0 2px 0 rgba(0,0,0,.12))}
.top{background:none}
.tools-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.tool{background:var(--surface);border-radius:18px;padding:11px 6px;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 2px 0 var(--line)}
.tool small{font-size:12px;color:var(--muted)}
.tool[disabled]{opacity:.45;cursor:default}
.result{position:fixed;inset:0;z-index:6;display:grid;place-items:end center;background:color-mix(in srgb,var(--ink) 25%,transparent);
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.result .sheet{width:100%;max-width:460px;background:var(--surface);border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;animation:rise .35s cubic-bezier(.3,1.3,.5,1)}
@keyframes rise{0%{transform:translateY(40px);opacity:0}100%{transform:none;opacity:1}}
.result .big{font-family:var(--f-word);font-weight:600;font-size:clamp(30px,9vw,42px);line-height:1.1;overflow-wrap:anywhere}
.result .earn{display:flex;gap:8px;align-items:center;font-family:var(--f-word);font-weight:700;font-size:20px;color:var(--coin-ink);background:color-mix(in srgb,var(--coin) 35%,transparent);border-radius:999px;padding:6px 14px}
.result .note{font-size:14px;color:var(--muted);line-height:1.5}
.result .btn-main{width:100%}
.qz-h{font-size:14px;color:var(--muted);letter-spacing:.04em}
.qz-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.qz-opt{background:var(--floe);border:2px solid transparent;border-radius:14px;padding:12px 8px;font-size:16px;line-height:1.4}
.qz-opt[disabled]{cursor:default}
.qz-opt.right{border-color:var(--good);background:var(--good-soft)}
.qz-opt.wrong{border-color:var(--again);background:var(--again-soft)}
.qz-miss{display:flex;flex-direction:column;gap:4px;font-size:15px;text-align:left;background:var(--floe);border-radius:14px;padding:10px 14px;width:100%;box-sizing:border-box}
.qz-miss b{font-family:var(--f-word);font-weight:600}

/* done */
.done{align-items:center;text-align:center;padding-top:24px}
.done h1{margin:0;font-size:26px;font-weight:400}
.done p{margin:0;color:var(--muted);line-height:1.6}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.summary .count{text-align:center}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:7;width:100%;height:100%}

/* shop */
.shelf{display:flex;flex-direction:column;gap:10px}
.shelf h3{margin:0;font-size:16px;font-weight:400;display:flex;justify-content:space-between;align-items:baseline}
.shelf h3 small{font-size:13px;color:var(--muted)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.item-card{background:var(--floe);border-radius:18px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;position:relative;border:2px solid transparent}
.item-card .sw{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;overflow:hidden}
.item-card .nm{font-size:14px;line-height:1.3}
.item-card .pr{font-family:var(--f-word);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:4px;color:var(--muted)}
.item-card .pr .coin{width:16px;height:16px;font-size:9px}
.item-card.equipped{border-color:var(--accent)}
.item-card.locked{opacity:.45}
.item-card.affordable .pr{color:var(--ink)}
.item-card .badge{position:absolute;top:6px;right:6px;font-size:11px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 6px}
.grand{display:flex;gap:14px;align-items:center}
.grand .sw{width:72px;flex:none}
.dex{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.dex div{background:var(--floe);border-radius:16px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted);gap:2px}
.dex svg{width:100%;max-width:56px}
.dex .unseen svg{filter:brightness(0) opacity(.18)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:15px;z-index:8;animation:rise .3s ease-out}

/* list */
.search{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:12px 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);-webkit-user-select:text;user-select:text}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:999px;background:var(--surface);font-size:14px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.list{background:var(--surface);border-radius:var(--r);overflow:hidden}
.item{display:grid;grid-template-columns:12px minmax(0,1fr);gap:12px;align-items:baseline;padding:11px 16px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .dot{width:10px;height:10px;border-radius:50%;align-self:center}
.item .w{font-family:var(--f-word);font-weight:600;font-size:17px}
.item .d{font-size:14px;color:var(--muted);line-height:1.5;overflow-wrap:anywhere}
.more{padding:14px;text-align:center;color:var(--muted);font-size:14px;width:100%}
/* seasonal garland */
.season{position:relative;display:flex;justify-content:space-between;align-items:flex-start;height:40px;padding:0 4px;margin-bottom:-6px}
.season:empty{display:none}
.season::before{content:"";position:absolute;left:0;right:0;top:-10px;height:12px;border-bottom:2px solid var(--muted);border-radius:0 0 50% 50%;opacity:.45}
.season svg{width:28px;height:36px;position:relative;transform-origin:50% 0;animation:sway 3.4s ease-in-out infinite}
.season svg:nth-child(even){animation-delay:-1.7s}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
/* evil mode: one deliberate dark-purple look in either theme */
body.evil{--bg:#1C1724;--surface:#2A2333;--floe:#3A3146;--ink:#EDE6F5;--muted:#B3A7C4;--line:#4A3F58;--wall:#2E2638;--counter:#1E1925;--accent:#B57EDC;--accent-ink:#1C1724;color-scheme:dark}
body.evil .shopfront{box-shadow:inset 0 0 40px #7B4BB044}
body.evil .tray{box-shadow:0 3px 0 #120F17, inset 0 0 18px #7B4BB033}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

function tone(freqs,dur=.12,type="sine",gap=.07,vol=.12){
  if(!S.sound) return;

    actx=actx||new (window.AudioContext||window.webkitAudioContext)();

  }catch(e){}
}

function rollDay(){ const t=today(); if(S.day!==t){ S.day=t; S.newDone=0; } }

const ORDER=(()=>{ let a=20261021; const r=()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
  const o=[...Array(N).keys()]; for(let i=N-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [o[i],o[j]]=[o[j],o[i]]; } return o; })();
function newList(lim){ const o=[]; for(let k=0;k<N&&o.length<lim;k++){ const i=ORDER[k]; if(!S.s[i]) o.push(i); } return o; }
function buildQueue(){
  rollDay();
  const due=dueList(), fresh=newList(Math.max(0,S.newPerDay-S.newDone)), q=[]; let i=0,j=0;
  while(i<due.length||j<fresh.length){ for(let k=0;k<2&&i<due.length;k++) q.push({w:due[i++],isNew:false,miss:false}); if(j<fresh.length) q.push({w:fresh[j++],isNew:true,miss:false}); }
  return q;
}
function grade(q, good){
  const t=today(), cur=S.s[q.w];
  if(good){
    if(q.miss) S.s[q.w]={b:1,d:t+1};
    else{ const b=Math.min((cur?cur.b:0)+1,INTERVAL.length-1); S.s[q.w]={b,d:t+INTERVAL[b]}; }
  }else S.s[q.w]={b:1,d:t};
}

function b64(bytes){ let s=""; for(let i=0;i<bytes.length;i+=8192) s+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192)); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function unb64(str){ str=str.replace(/-/g,"+").replace(/_/g,"/"); while(str.length%4) str+="="; const bin=atob(str), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
async function pipe(bytes,stream){ const s=new Blob([bytes]).stream().pipeThrough(stream); return new Uint8Array(await new Response(s).arrayBuffer()); }
async function makeBackup(){
  const o=persisted(); o.s=Object.entries(o.s||{}).map(([k,v])=>[+k,v.b,v.d]);
  const raw=new TextEncoder().encode(JSON.stringify(o));
  if(typeof CompressionStream!=="undefined"){ try{ return "SEAL1z."+b64(await pipe(raw,new CompressionStream("deflate-raw"))); }catch(e){} }
  return "SEAL1."+b64(raw);
}
async function readBackup(code){
  code=(code||"").trim().replace(/\s+/g,"");
  const m=code.match(/^SEAL1(z?)\.([A-Za-z0-9_-]+)$/); if(!m) throw new Error("format");
  let bytes=unb64(m[2]);
  if(m[1]){ if(typeof DecompressionStream==="undefined") throw new Error("old"); bytes=await pipe(bytes,new DecompressionStream("deflate-raw")); }
  const o=JSON.parse(new TextDecoder().decode(bytes));
  const s={}; (o.s||[]).forEach(a=>{ if(Array.isArray(a)&&a.length===3) s[a[0]]={b:a[1],d:a[2]}; }); o.s=s;
  return normalize(o);
}

    <div class="big">${esc(w)}</div>${speakBtn()}
    <div class="note">選出它的中文意思</div>
    <div class="qz-opts">${it.arr.map((t,i)=>`<button class="qz-opt" data-i="${i}">${esc(t)}</button>`).join("")}</div>
    <div class="note" id="qzFb"></div>
    <button class="btn-main" id="qzNext" hidden>${QZ.k+1<QZ.items.length?"下一題":"看結果"}</button>`;
  $("result").hidden=false; setTimeout(()=>speak(w),250);
}
function quizAnswer(i){
  const it=QZ.items[QZ.k]; if(it.ans!==null) return; it.ans=i;
  const ok=i===it.a;
  document.querySelectorAll(".qz-opt").forEach((b,j)=>{ b.disabled=true; if(j===it.a) b.classList.add("right"); else if(j===i) b.classList.add("wrong"); });
  if(ok){ QZ.ok++; G.coins+=QUIZ_COIN; addCoins(QUIZ_COIN); sfx.ok(); $("qzFb").textContent=`答對了！+${QUIZ_COIN} 金幣`; }
  else{ sfx.bad(); S.s[it.w]={b:1,d:today()+1}; $("qzFb").textContent="這個字明天會再複習一次。"; }
  save(); $("qzNext").hidden=false;
}
function quizNext(){
  QZ.k++;
  if(QZ.k<QZ.items.length) return renderQuiz();
  const n=QZ.items.length; G.qOk+=QZ.ok; G.qTot+=n;
  const missed=QZ.items.filter(x=>x.ans!==x.a);
  $("sheet").innerHTML=`<div class="qz-h">${QZ.title}</div><div style="width:110px">${sealSVG(110,hat(),S.evil)}</div>
    <div class="big">${QZ.ok} / ${n}</div>
    <div class="note">${QZ.ok===n?"全對！這些字都記住了。":"下面這幾個字明天會再出現："}</div>
    ${missed.length?`<div class="qz-miss">${missed.map(x=>`<div><b>${esc(WORDS[x.w][0])}</b>　${esc(shortDef(x.w))}</div>`).join("")}</div>`:""}
    <button class="btn-main" id="qzDone">繼續</button>`;
  if(QZ.ok===n) sealMood($("sheet"),"happy");
}
$("gQuit").addEventListener("click",()=>{ busy=false; G=null; QZ=null; $("result").hidden=true; show("v-home"); renderHome(); });
function dayComplete(){
  const t=today(); let bonus=0;
  if(S.lastDay!==t){ S.streak=(S.lastDay===t-1)?S.streak+1:1; S.lastDay=t; }
  if(S.bonusDay!==t && dueList().length===0 && newList(Math.max(0,S.newPerDay-S.newDone)).length===0){ S.bonusDay=t; bonus=ECON.dailyBonus; S.coins+=bonus; }
  save(); pushRemote(); return bonus;
}
function finishGame(){
  busy=false; const bonus=dayComplete();
  $("sTotal").textContent=G.done.size; $("sTotalL").textContent="做了幾個"; $("sGood").textContent=G.firstTry; $("sCoins").textContent=G.coins+bonus;
  $("sealDone").innerHTML=sealSVG(150,hat(),S.evil);
  $("doneTitle").textContent="今天打烊囉！";
  $("doneText").textContent=(bonus?`完成今天的份量，加送 ${bonus} 金幣。`:"")+(G.qTot?`小考答對 ${G.qOk}/${G.qTot}。`:"")+`已經連續 ${S.streak} 天。去商店看看能換什麼吧！`;
  show("v-done"); sealMood($("sealDone"),"happy"); confetti(); G=null;
}

/* ===== flashcards ===== */
let queue=[],pos=0,flipped=false,sess=null;
function startCards(){
  queue=buildQueue(); if(!queue.length) return;
  pos=0; busy=true; sess={total:queue.length,firstTry:0,seen:new Set()};
  show("v-study"); renderCard();
}
function renderCard(){
  const q=queue[pos],[w,def]=WORDS[q.w];
  const tag=q.isNew?`<span class="tag new">新單字</span>`:q.miss?`<span class="tag">再試一次</span>`:`<span class="tag">複習</span>`;
  if(S.dir==="en"){ $("front").innerHTML=`${tag}<div class="word">${esc(w)}</div>${speakBtn()}<div class="hint">先在心裡想想中文意思</div>`; }
  else{ $("front").innerHTML=`${tag}${sensesHTML(def)}<div class="hint">先在心裡拼拼看英文</div>`; }
  $("back").innerHTML=`<div class="word">${esc(w)}</div>${sensesHTML(def)}${speakBtn()}`;
  flipped=false; $("card").classList.remove("flipped"); $("flipBtn").hidden=false; $("answers").hidden=true;
  $("fill").style.width=(sess.seen.size/sess.total*100)+"%"; $("tally").textContent=`${sess.seen.size} / ${sess.total}`;
}
function flip(){ if(flipped) return; flipped=true; $("card").classList.add("flipped"); $("flipBtn").hidden=true; $("answers").hidden=false; if(S.dir==="zh") speak(WORDS[queue[pos].w][0]); }
$("card").addEventListener("click",e=>{ if(e.target.closest("[data-speak]")){ e.stopPropagation(); speak(WORDS[queue[pos].w][0]); return; } flip(); });
$("card").addEventListener("keydown",e=>{ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); flip(); }});
$("flipBtn").addEventListener("click",flip);
function answer(good){
  const q=queue[pos];
  S.lastActive=today();
  if(q.isNew&&!sess.seen.has(q.w)) S.newDone++;
  if(good){ if(!q.miss&&!sess.seen.has(q.w)) sess.firstTry++; grade(q,true); sess.seen.add(q.w); }
  else{ grade(q,false); queue.splice(Math.min(pos+4,queue.length),0,{w:q.w,isNew:false,miss:true}); }
  save(); pos++;
  if(pos>=queue.length) finishCards(); else renderCard();
}
$("bGood").addEventListener("click",()=>answer(true));
$("bAgain").addEventListener("click",()=>answer(false));
$("quit").addEventListener("click",()=>{ busy=false; show("v-home"); renderHome(); });
function finishCards(){
  busy=false; const bonus=dayComplete();
  $("sTotal").textContent=sess.seen.size; $("sTotalL").textContent="練了幾張"; $("sGood").textContent=sess.firstTry; $("sCoins").textContent=bonus;
  $("sealDone").innerHTML=sealSVG(150,hat(),S.evil);
  $("doneTitle").textContent="今天完成了！";
  $("doneText").textContent=(bonus?`完成今天的份量，加送 ${bonus} 金幣。`:"")+`已經連續 ${S.streak} 天。翻卡不送金幣，做可麗餅才有喔。`;
  show("v-done"); sealMood($("sealDone"),"happy"); confetti();
}
$("backHome").addEventListener("click",()=>{ show("v-home"); renderHome(); });
$("startGame").addEventListener("click",startGame);
$("startCards").addEventListener("click",startCards);

/* ===== shop ===== */
function swatch(cat,i){
  const it=cat.list[i];
  if(cat.k==="crust") return `<div class="sw" style="background:${it.a==='rainbow'?fillOf(it):`radial-gradient(circle,${it.a} 0 55%,${it.b} 100%)`}"></div>`;
  if(cat.k==="stove") return `<div class="sw" style="border-radius:14px;background:${it.a};box-shadow:inset 0 -5px 0 ${it.b}"><div style="width:60%;aspect-ratio:1;border-radius:50%;background:${it.b}"></div></div>`;
  if(cat.k==="stick") return `<div class="sw" style="background:var(--surface)"><svg viewBox="0 0 40 40" width="40"><rect x="6" y="12" width="28" height="5" rx="2.5" fill="${it.a==='rainbow'?'#F7B0C1':it.a}"/><rect x="17.5" y="12" width="5" height="22" rx="2.5" fill="${it.a==='rainbow'?'#A9D6F2':it.a}"/>${it.star?'<path d="M20 2l2 4 4 1-3 3 1 4-4-2-4 2 1-4-3-3 4-1z" fill="#F5B83D"/>':''}</svg></div>`;
  const icons=["","▼▲","✿","∙∙∙","ABC","▢","✦"];
  return `<div class="sw" style="background:var(--surface);font-family:var(--f-word);font-weight:700;color:var(--accent);font-size:15px">${icons[i]||""}</div>`;
}
function renderShop(){
  setCoins();
  let h="";
  for(const cat of CATS){
    const owned=S.owned[cat.k];
    h+=`<div class="panel shelf"><h3>${cat.t}<small>${owned}/6</small></h3><div class="items">`;
    cat.list.forEach((it,i)=>{
      const have = i<=owned, next = i===owned+1, price = i>0?ECON.prices[i-1]:0;
      const eq = cat.equip ? S.equip[cat.k]===i : false;
      const cls=["item-card", eq?"equipped":"", (!have&&!next)?"locked":"", (next&&S.coins>=price)?"affordable":""].join(" ");
      const label = have ? (cat.equip ? (eq?"使用中":"換上") : (i===0?"":"已裝上")) : next ? `<span class="coin">$</span>${price}` : `<span class="coin">$</span>${price}`;
      h+=`<button class="${cls}" data-k="${cat.k}" data-i="${i}" ${(!have&&!next)?'aria-disabled="true"':''}>${swatch(cat,i)}<span class="nm">${esc(it.n)}</span><span class="pr">${label}</span>${(next&&S.coins>=price)?'<span class="badge">可兌換</span>':''}</button>`;
    });
    h+=`</div></div>`;
  }
  const skinCard=(id,name,sub,owned,price)=>{ const eq=S.skin===id; const lab=owned?(eq?"使用中":"換上"):`<span class="coin">$</span>${price}`;
    return `<button class="item-card${eq?" equipped":""}${(!owned&&S.coins>=price)?" affordable":""}" data-skin="${id}"><div class="sw" style="width:84px;height:62px;border-radius:14px;background:var(--surface)">${sealSVG(76,"",false,id)}</div><span class="nm">${name}</span><span class="hint" style="font-size:12px">${sub}</span><span class="pr">${lab}</span>${(!owned&&S.coins>=price)?'<span class="badge">可兌換</span>':''}</button>`; };
  h+=`<div class="panel shelf"><h3>海豹造型<small>${S.skins.banana?2:1}/2</small></h3><div class="items">${skinCard("classic","小白海豹","原本的海豹",true,0)}${skinCard("banana","香蕉海豹","自己畫的",S.skins.banana,SKIN_PRICE)}</div></div>`;
  const allDone=CATS.every(c=>S.owned[c.k]>=6);
  h+=`<div class="panel"><div class="grand"><div class="sw">${sealSVG(72,true,false,"classic")}</div><div style="display:flex;flex-direction:column;gap:6px;flex:1;min-width:0">
    <b style="font-weight:400;font-size:17px">海豹主廚的招牌店</b>
    <span class="hint">${S.grand?"已經是招牌店了！海豹戴上了主廚帽。":allDone?"四類升級都完成了，可以換大獎了！":"四類升級全部完成後解鎖：海豹戴上主廚帽，店門口掛上招牌。"}</span>
    ${S.grand?"":`<button class="btn-main" id="buyGrand" ${(!allDone||S.coins<ECON.grand)?"disabled":""} style="font-size:16px;padding:11px 16px"><span style="display:inline-flex;gap:6px;align-items:center">兌換　<span class="coin">$</span>${ECON.grand}</span></button>`}
    </div></div></div>`;
  h+=`<div class="panel"><h2>客人圖鑑　${S.seen.length}/${CUST.length}</h2><div class="dex">${CUST.map((c,i)=>{const s=S.seen.includes(i);return `<div class="${s?'':'unseen'}">${custSVG(i,"idle")}<span>${s?c.n:"？？"}</span></div>`}).join("")}</div>
    <div class="hint">做可麗餅時會遇到不同的客人，有些客人很少出現。</div></div>`;
  $("shelves").innerHTML=h;
}
$("shelves").addEventListener("click",e=>{
  const skb=e.target.closest("[data-skin]");
  if(skb){
    const id=skb.dataset.skin;
    if(id==="classic"||S.skins[id]){ S.skin=id; save(); sfx.pop(); renderShop(); return; }
    if(S.coins<SKIN_PRICE){ toast(`還差 ${SKIN_PRICE-S.coins} 金幣`); return; }
    S.coins-=SKIN_PRICE; S.skins[id]=true; S.skin=id; save(); sfx.buy(); confetti(); toast("換上香蕉海豹了！"); renderShop(); return;
  }
  if(e.target.closest("#buyGrand")){
    if(S.coins<ECON.grand) return; S.coins-=ECON.grand; S.grand=true; save(); sfx.buy(); confetti(); toast("恭喜！變成招牌店了"); renderShop(); return;
  }
  const b=e.target.closest(".item-card"); if(!b) return;
  const k=b.dataset.k, i=+b.dataset.i, cat=CATS.find(c=>c.k===k), owned=S.owned[k];
  if(i<=owned){ if(cat.equip){ S.equip[k]=i; save(); sfx.pop(); renderShop(); } return; }
  if(i!==owned+1){ toast("要先換前面的才行"); return; }
  const price=ECON.prices[i-1];
  if(S.coins<price){ toast(`還差 ${price-S.coins} 金幣`); return; }
  S.coins-=price; S.owned[k]=i; if(cat.equip) S.equip[k]=i; save(); sfx.buy(); toast(`換到「${cat.list[i].n}」了！`); renderShop();
});
$("toShop").addEventListener("click",()=>{ show("v-shop"); renderShop(); });
$("shopBack").addEventListener("click",()=>{ show("v-home"); renderHome(); });

/* ===== confetti ===== */
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c=$("confetti"),x=c.getContext("2d"); c.hidden=false;
  const W=c.width=innerWidth*devicePixelRatio,H=c.height=innerHeight*devicePixelRatio;
  const cs=getComputedStyle(document.documentElement), cols=["--accent","--good","--again","--coin"].map(v=>cs.getPropertyValue(v).trim());
  const P=Array.from({length:90},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*14*devicePixelRatio,vy:(-Math.random()*16-6)*devicePixelRatio,r:(Math.random()*5+4)*devicePixelRatio,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6,s:Math.random()<.5}));
  let f=0;(function tick(){ x.clearRect(0,0,W,H);
    for(const p of P){ p.vy+=.5*devicePixelRatio; p.x+=p.vx; p.y+=p.vy; p.vx*=.99; p.a+=.15; x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle=p.c; if(p.s){x.beginPath();x.arc(0,0,p.r*.6,0,7);x.fill();}else x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); x.restore(); }
    if(++f<150) requestAnimationFrame(tick); else { x.clearRect(0,0,W,H); c.hidden=true; } })();
}

/* ===== list ===== */
let filter="all",shown=150;
function status(i){ const s=S.s[i]; if(!s) return "new"; return s.b>=KNOWN_BOX?"known":"learning"; }
function renderList(){
  const q=$("q").value.trim().toLowerCase(), rows=[];
  for(let i=0;i<N;i++){ const st=status(i); if(filter!=="all"&&st!==filter) continue; const [w,d]=WORDS[i]; if(q&&!w.toLowerCase().includes(q)&&!d.includes(q)) continue; rows.push([i,st]); }
  const color={known:"var(--good)",learning:"var(--accent)",new:"var(--line)"};
  $("list").innerHTML=rows.slice(0,shown).map(([i,st])=>`<div class="item"><span class="dot" style="background:${color[st]}"></span><div><div class="w">${esc(WORDS[i][0])}</div><div class="d">${esc(WORDS[i][1])}</div></div></div>`).join("")
    +(rows.length>shown?`<button class="more" id="more">再顯示更多（還有 ${rows.length-shown} 個）</button>`:"")+(rows.length===0?`<div class="more">沒有符合的單字</div>`:"");
  const m=$("more"); if(m) m.addEventListener("click",()=>{ shown+=300; renderList(); });
}
$("toList").addEventListener("click",()=>{ shown=150; show("v-list"); renderList(); });
$("listBack").addEventListener("click",()=>{ show("v-home"); renderHome(); });
$("q").addEventListener("input",()=>{ shown=150; renderList(); });
$("filters").addEventListener("click",e=>{ const b=e.target.closest(".chip"); if(!b) return; filter=b.dataset.f; for(const c of $("filters").children) c.setAttribute("aria-pressed",String(c===b)); shown=150; renderList(); });

$("sealDone").innerHTML=sealSVG(150,false);
if(PREVIEW){ $("pvBar").hidden=false; }
$("pvExit").addEventListener("click",()=>{ if(REAL){ S.evil=REAL.evil; S.purify=REAL.purify; S.evilDay=REAL.evilDay; S.wiped=REAL.wiped; } PREVIEW=false; REAL=null; $("pvBar").hidden=true; try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){} document.body.classList.toggle("evil",!!S.evil); show("v-home"); renderHome(); if(!$("v-game").hidden) applyLooks(); });
renderHome();
</script>
